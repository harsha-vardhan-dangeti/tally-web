# XcodeGen spec for Tally for Mac. Generate the Xcode project with `xcodegen` (brew install xcodegen).
name: Tally
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Tally:
    type: application
    platform: macOS
    sources:
      - TallyMac
      - Shared
    dependencies:
      - target: TallyWidgets
    info:
      path: TallyMac/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: "14.0"
        TallyURL: $(TALLY_URL)
        TallyAppGroup: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [tally]
    entitlements:
      path: TallyMac/Tally.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_NAME: Tally
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TallyWidgets:
    type: app-extension
    platform: macOS
    sources:
      - TallyWidgets
      - Shared
    info:
      path: TallyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TallyAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TallyWidgets/TallyWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_NAME: TallyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widgets
        SKIP_INSTALL: YES
